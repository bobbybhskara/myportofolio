<div
    id="delete-project-{{ project.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-project-title-{{ project.id }}"
>
    <button
        type="button"
        class="project-delete-modal__backdrop"
        popovertarget="delete-project-{{ project.id }}"
        popovertargetaction="hide"
        aria-label="Close delete confirmation"
    ></button>

    <div class="project-delete-modal__content">
        <button
            type="button"
            class="project-delete-modal__close"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"
        >
            &times;
        </button>

        <h2 id="delete-project-title-{{ project.id }}">Delete Project?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ project.title }}</strong>?
        </p>

        <form
            method="post"
            action="{% url 'main:delete_project' project.id %}"
            class="project-delete-modal__actions"
        >
            {% csrf_token %}
            <button
                type="button"
                class="button button-secondary"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
            >
                Cancel
            </button>
            <button type="submit" class="button button-danger">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
